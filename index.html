  <div id="__bundler_placeholder">Loading MassHub - Built for Enthusiasts....</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

round: #2A3240; box-shadow: 0 10px 30px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: {{accent}}\">09<\u002Fdiv><span style=\"font-size: 11px; letter-spacing: 0.2em; color: #9FB0C2\">SECONDS<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<a href=\"{{waitlistUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top: 40px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; padding: 16px 32px; border-radius: 999px; box-shadow: 0 10px 30px rgba(240,78,35,0.35)\">Join the Waitlist<\u002Fa>\n<a href=\"#platform\" style=\"margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #9FB0C2; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.24em\">WHAT IS MASSHUB?<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fheader>\n\n<!-- THE PLATFORM (existing, kept) -->\n<section id=\"platform\" class=\"mh-sec\" style=\"padding: 112px 24px; display: flex; flex-direction: column; align-items: center; text-align: center\">\n<p style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: #FF6B3D\">THE PLATFORM<\u002Fp>\n<h2 style=\"margin: 20px 0 0; max-width: 760px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700\">A social platform connecting local cycling, motorcycling, and driving enthusiasts.<\u002Fh2>\n<p style=\"margin: 28px 0 0; max-width: 560px; font-size: 17px; line-height: 1.6; color: #B4C2D1\">Discover and connect with local riders and drivers who share your obsession. MassHub brings the people behind the passion together — organize group rides, find events near you, and build real community around the machines you love. No noise, no gatekeeping. Just enthusiasts, connected.<\u002Fp>\n<ul style=\"list-style: none; margin: 36px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 640px\">\n<li style=\"display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 500\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{accent}}\"><\u002Fspan>Discover local enthusiasts<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 500\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{accent}}\"><\u002Fspan>Find group rides &amp; events<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 500\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{accent}}\"><\u002Fspan>Build real connections<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<!-- NEW: PICK YOUR LANE -->\n<section id=\"lanes\" class=\"mh-sec\" style=\"padding: 112px 24px; display: flex; flex-direction: column; align-items: center\">\n<p style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: #FF6B3D\">PICK YOUR LANE<\u002Fp>\n<h2 style=\"margin: 20px 0 0; max-width: 720px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700\">Your feed stays yours.<\u002Fh2>\n<p style=\"margin: 18px 0 0; max-width: 540px; text-align: center; font-size: 17px; line-height: 1.6; color: #B4C2D1\">Cyclists see cycling. Riders see riding. Drivers see driving. Choose one lane or all three — nothing bleeds over unless you want it to.<\u002Fp>\n<div style=\"margin-top: 56px; width: 100%; max-width: 1120px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n\n<article class=\"mh-lane\" style=\"background: #2F3848; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<svg style=\"align-self: center\" width=\"64\" height=\"48\" sc-camel-view-box=\"0 0 64 48\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#ff5722\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"15\" cy=\"32\" r=\"10\"><\u002Fcircle><circle cx=\"49\" cy=\"32\" r=\"10\"><\u002Fcircle><path d=\"M15 32 L25 15 L31 32 Z M25 15 H42 L45 22 L31 32 M45 22 L49 32 M25 15 L23 10 M18 10 H27 M42 15 L40 7 H47 Q52 7 52 11 Q52 14 49 14\"><\u002Fpath><circle cx=\"31\" cy=\"32\" r=\"2\"><\u002Fcircle><\u002Fg><\u002Fsvg>\n<h3 style=\"margin: 0; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700\">Cyclists<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #B4C2D1\">Road, gravel, MTB, fixed. Find the Saturday group ride that matches your pace.<\u002Fp>\n<ul style=\"margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #DDE5EE\">\n<li style=\"display: flex; gap: 10px; align-items: center\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{accent}}\"><\u002Fspan>Group rides filtered by pace &amp; distance<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center\"><span style=\"width: 6px; height: 6px; border-radius ackground: #3D4A60\"><\u002Fdiv><div style=\"border-radius: 6px; background: #46536A\"><\u002Fdiv><div style=\"border-radius: 6px; background: #3D4A60\"><\u002Fdiv><\u002Fdiv>\n<span style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(20,26,36,0.8); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #DDE5EE\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 018 0v3\"><\u002Fpath><\u002Fsvg>AT LAUNCH<\u002Fspan>\n<\u002Fdiv>\n<div class=\"mh-tbody\" style=\"padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700\">StockHub<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #B4C2D1\">Buy and sell parts and gear with people who get it.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- NEW: HOW IT WORKS -->\n<section class=\"mh-sec\" style=\"padding: 112px 24px; display: flex; flex-direction: column; align-items: center\">\n<p style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: #FF6B3D\">HOW IT WORKS<\u002Fp>\n<h2 style=\"margin: 20px 0 0; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700\">Three steps to your crew.<\u002Fh2>\n<ol class=\"mh-steps\" style=\"list-style: none; margin: 56px 0 0; padding: 0; width: 100%; max-width: 1040px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px\">\n<li style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px\"><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; color: {{accent}}\">01<\u002Fspan><h3 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700\">Join the waitlist<\u002Fh3><p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #B4C2D1\">Lock in early access before doors open.<\u002Fp><\u002Fli>\n<li style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px\"><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; color: {{accent}}\">02<\u002Fspan><h3 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700\">Pick your lane &amp; area<\u002Fh3><p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #B4C2D1\">Two wheels, four wheels, or both — and where you ride.<\u002Fp><\u002Fli>\n<li style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px\"><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; color: {{accent}}\">03<\u002Fspan><h3 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700\">Show up<\u002Fh3><p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #B4C2D1\">Find a ride this weekend. Meet the people behind the handles.<\u002Fp><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<!-- NEW: FINAL CTA -->\n<section id=\"join\" class=\"mh-sec\" style=\"padding: 120px 24px; display: flex; flex-direction: column; align-items: center; text-align: center\">\n<h2 style=\"margin: 0; max-width: 680px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; font-weight: 700\">Your next ride starts <span style=\"color: {{accent}}\">here.<\u002Fspan><\u002Fh2>\n<p style=\"margin: 18px 0 0; max-width: 460px; font-size: 17px; line-height: 1.6; color: #B4C2D1\">Get early access and help shape what MassHub becomes.<\u002Fp>\n<a href=\"{{waitlistUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top: 36px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; padding: 16px 32px; border-radius: 999px; box-shadow: 0 10px 30px rgba(240,78,35,0.35)\">Join the Waitlist<\u002Fa>\n<\u002Fsection>\n\n<footer style=\"background: #2B3A4F; padding: 48px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px\">\n<a href=\"https://masshub.com/\" aria-label=\"MassHub home\" style=\"display: block\"><img src=\"71c69ea3-18a7-4df3-ab87-e4a1325c25d2\" alt=\"MassHub\" style=\"display: block; height: 96px; width: auto\"><\u002Fa>\n<p style=\"margin: 0; font-size: 13px; color: #9FB0C2\">© 2026 MassHub · Built for Enthusiasts. Powered by Community.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div class=\"mh-root\" style=\"font-family: Manrope, system-ui, sans-serif; color: #F4F7FA; background: #283142; width: 100%; position: relative\" data-canvas-width=\"1440\" data-canvas-height=\"4700\" data-document-role=\"page\" data-label=\"Landing page (desktop)\">\n<div class=\"mh-bg\" aria-hidden=\"true\"><\u002Fdiv>\n\n\n<header class=\"mh-hero\" style=\"padding: 96px 24px 48px; display: flex; flex-direction: column; align-items: center; min-height: 760px; box-sizing: border-box\">\n<a href=\"https://masshub.com/\" aria-label=\"MassHub home\" style=\"display: block\"><img src=\"71c69ea3-18a7-4df3-ab87-e4a1325c25d2\" alt=\"MassHub\" class=\"mh-logo\" style=\"display: block; height: 180px; width: auto\"><\u002Fa>\n<nav aria-label=\"Primary\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; margin-top: 40px\">\n<a href=\"#platform\" style=\"color: #C3CFDB; text-decoration: none; font-size: 14px; font-weight: 500\">Platform<\u002Fa>\n<a href=\"#lanes\" style=\"color: #C3CFDB; text-decoration: none; font-size: 14px; font-weight: 500\">Your lane<\u002Fa>\n<a href=\"#inside\" style=\"color: #C3CFDB; text-decoration: none; font-size: 14px; font-weight: 500\">What's inside<\u002Fa>\n<\u002Fnav>\n<h1 style=\"margin: 80px 0 0; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: clamp(40px, 6vw, 74px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 700\">Built for Enthusiasts.<br><span style=\"color: #F04E23\">Powered by Community.<\u002Fspan><\u002Fh1>\n<p style=\"margin: 36px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.32em; color: #9FB0C2\">LAUNCHING IN<\u002Fp>\n<div class=\"mh-cdrow\" style=\"display: flex; gap: 20px; margin-top: 18px; flex-wrap: wrap; justify-content: center\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px\"><div class=\"mh-cd\" style=\"width: 92px; height: 124px; border-radius: 10px; background: #2A3240; box-shadow: 0 10px 30px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: #F04E23\">54<\u002Fdiv><span style=\"font-size: 11px; letter-spacing: 0.2em; color: #9FB0C2\">DAYS<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px\"><div class=\"mh-cd\" style=\"width: 92px; height: 124px; border-radius: 10px; background: #2A3240; box-shadow: 0 10px 30px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: #F04E23\">10<\u002Fdiv><span style=\"font-size: 11px; letter-spacing: 0.2em; color: #9FB0C2\">HOURS<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px\"><div class=\"mh-cd\" style=\"width: 92px; height: 124px; border-radius: 10px; background: #2A3240; box-shadow: 0 10px 30px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: #F04E23\">35<\u002Fdiv><span style=\"font-size: 11px; letter-spacing: 0.2em; color: #9FB0C2\">MINUTES<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px\"><div class=\"mh-cd\" style=\"width: 92px; height: 124px; border-radius: 10px; background: #2A3240; box-shadow: 0 10px 30px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: #F04E23\">09<\u002Fdiv><span style=\"font-size: 11px; letter-spacing: 0.2em; color: #9FB0C2\">SECONDS<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<a target=\"_blank\" rel=\"noopener\" style=\"margin-top: 40px; background: #F04E23; color: #FFFFFF; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; padding: 16px 32px; border-radius: 999px; box-shadow: 0 10px 30px rgba(240,78,35,0.35)\">Join the Waitlist<\u002Fa>\n<a href=\"#platform\" style=\"margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #9FB0C2; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.24em\">WHAT IS MASSHUB?<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fheader>\n\n\n<section id=\"platform\" class=\"mh-sec\" style=\"padding: 112px 24px; display: flex; flex-direction: column; align-items: center; text-align: center\">\n<p style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: #FF6B3D\">THE PLATFORM<\u002Fp>\n<h2 style=\"margin: 20px 0 0; max-width: 760px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700\">A social platform connecting local cycling, motorcycling, and driving enthusiasts.<\u002Fh2>\n<p style=\"margin: 28px 0 0; max-width: 560px; font-size: 17px; line-height: 1.6; color: #B4C2D1\">Discover and connect with local riders and drivers who share your obsession. MassHub brings the people behind the passion together — organize group rides, find events near you, and build real community around the machines you love. No noise, no gatekeeping. Just enthusiasts, connected.<\u002Fp>\n<ul style=\"list-style: none; margin: 36px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 640px\">\n<li style=\"display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 500\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #F04E23\"><\u002Fspan>Discover local enthusiasts<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 500\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #F04E23\"><\u002Fspan>Find group rides &amp; events<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 500\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #F04E23\"><\u002Fspan>Build real connections<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n\n<section id=\"lanes\" class=\"mh-sec\" style=\"padding: 112px 24px; display: flex; flex-direction: column; align-items: center\">\n<p style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: #FF6B3D\">PICK YOUR LANE<\u002Fp>\n<h2 style=\"margin: 20px 0 0; max-width: 720px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700\">Your feed stays yours.<\u002Fh2>\n<p style=\"margin: 18px 0 0; max-width: 540px; text-align: center; font-size: 17px; line-height: 1.6; color: #B4C2D1\">Cyclists see cycling. Riders see riding. Drivers see driving. Choose one lane or all three — nothing bleeds over unless you want it to.<\u002Fp>\n<div style=\"margin-top: 56px; width: 100%; max-width: 1120px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n\n<article class=\"mh-lane\" style=\"background: #2F3848; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<svg style=\"align-self: center\" width=\"64\" height=\"48\" viewBox=\"0 0 64 48\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#ff5722\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"15\" cy=\"32\" r=\"10\"><\u002Fcircle><circle cx=\"49\" cy=\"32\" r=\"10\"><\u002Fcircle><path d=\"M15 32 L25 15 L31 32 Z M25 15 H42 L45 22 L31 32 M45 22 L49 32 M25 15 L23 10 M18 10 H27 M42 15 L40 7 H47 Q52 7 52 11 Q52 14 49 14\"><\u002Fpath><circle cx=\"31\" cy=\"32\" r=\"2\"><\u002Fcircle><\u002Fg><\u002Fsvg>\n<h3 style=\"margin: 0; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700\">Cyclists<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #
